display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav button{background:none;padding:8px 2px;color:var(--muted);font-size:11px;cursor:pointer}.nav button.active{color:var(--pink)}.nav b{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.sheet{width:min(560px,100%);margin:auto;background:#171021;border:1px solid #38284a;border-radius:25px 25px 0 0;padding:22px;max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.close{float:right;background:#ffffff0c;border-radius:50%;width:34px;height:34px;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.status{color:var(--good);font-size:12px;margin-top:8px}

let library=JSON.parse(localStorage.getItem("animeshelf_library")||"{}");
let currentTab="home";

function save(){localStorage.setItem("animeshelf_library",JSON.stringify(library))}
function find(q){q=q.toLowerCase();return ANIME.filter(a=>(a.title_ru+" "+a.title_original+" "+a.genres.join(" ")+" "+a.tags.join(" ")).toLowerCase().includes(q))}
function card(a){
 const e=library[a.id]||{};
 return `<div class="card" onclick="openAnime('${a.id}')"><div class="poster">${a.title_ru}</div><div class="info"><div class="title">${a.title_ru}</div><div class="meta">${a.year} · ${a.type} · ${a.episodes} эп.</div><div class="chips">${a.genres.slice(0,3).map(x=>`<span class="chip">${x}</span>`).join("")}</div>${e.score?`<div class="score">★ ${e.score}/10</div>`:""}${e.status?`<div class="status">${e.status}</div>`:""}</div></div>`
}
function render(){
 let body="";
 if(currentTab==="home"){
  const rec=ANIME.filter(a=>!library[a.id]).slice(0,3);
  body=`<h1>Привет, Тоша 👋</h1><p class="sub">Давай найдём что-нибудь хорошее на сегодня.</p>
  <div class="hero"><div class="eyebrow">Твоя полка</div><h2>🎲 Удиви меня</h2><p>Выберу случайный тайтл из того, что ты ещё не добавлял.</p><button class="btn" onclick="surprise()">Попробовать</button></div>
  <div class="section"><h3>Может тебе зайти</h3><span>${rec.length} сегодня</span></div><div class="cards">${rec.map(card).join("")}</div>`;
 } else if(currentTab==="search"){
  body=`<h1>Поиск</h1><p class="sub">Ищи по названию, жанру или теме.</p><div class="search"><input id="q" placeholder="Например, «восточный»" oninput="doSearch(this.value)"></div><div id="results"></div>`;
 } else if(currentTab==="library"){
  const items=ANIME.filter(a=>library[a.id]);
  body=`<h1>Моя библиотека</h1><p class="sub">${items.length} тайтлов в твоей полке</p><div class="chips" style="margin-bottom:16px"><span class="chip">Все</span><span class="chip">Смотрю</span><span class="chip">Посмотрено</span><span class="chip">Хочу</span><span class="chip">Любимое</span></div><div class="cards">${items.length?items.map(card).join(""):`<div class="empty">Пока пусто. Найдём тебе первое аниме? 👀</div>`}</div>`;
 } else {
  const items=ANIME.filter(a=>library[a.id]&&library[a.id].score).sort((a,b)=>library[b.id].score-library[a.id].score);
  body=`<h1>Мой вкус</h1><p class="sub">Здесь со временем будет формироваться твой персональный профиль.</p>
  <div class="hero"><div class="eyebrow">Пока собираем данные</div><h2>🧠 Твой аниме-вкус</h2><p>Оцени несколько тайтлов — и AnimeShelf начнёт искать общие черты между тем, что тебе действительно нравится.</p></div>
  <div class="section"><h3>Твои оценки</h3></div><div class="cards">${items.length?items.map(card).join(""):`<div class="empty">Поставь первую оценку — и начнём учиться.</div>`}</div>`;
 }
 document.getElementById("root").innerHTML=`<main class="app"><div class="top"><div class="logo">Anime<span>Shelf</span></div><div class="avatar">Т</div></div>${body}</main>
 <nav class="nav">${nav("home","⌂","Главная")}${nav("search","⌕","Поиск")}${nav("library","▣","Библиотека")}${nav("taste","✦","Мой вкус")}</nav><div id="modal" class="modal"></div>`;
}
function nav(id,icon,label){return `<button class="${currentTab===id?'active':''}" onclick="tab('${id}')"><b>${icon}</b>${label}</button>`}
function tab(id){currentTab=id;render();if(id==="search")document.getElementById("q")?.focus()}
function doSearch(q){let r=find(q);document.getElementById("results").innerHTML=r.slice(0,30).map(card).join("")||`<div class="empty">Ничего не нашёл 🤔</div>`}
function openAnime(id){
 const a=ANIME.find(x=>x.id===id), e=library[id]||{};
 document.getElementById("modal").style.display="flex";
 document.getElementById("modal").innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="poster" style="width:100%;height:180px;font-size:22px;margin-bottom:18px">${a.title_ru}</div><h2>${a.title_ru}</h2><div class="meta">${a.title_original} · ${a.year} · ${a.type} · ${a.episodes} эп.</div><p>${a.description_ru||"Описание добавим в следующей версии. Сейчас важнее протестировать библиотеку и рекомендации."}</p><div class="chips">${a.tags.map(x=>`<span class="chip">${x}</span>`).join("")}</div><div class="actions">
 <button class="btn" onclick="setStatus('${a.id}','Хочу посмотреть')">📌 Хочу</button>
 <button class="ghost" onclick="setStatus('${a.id}','Смотрю')">👀 Смотрю</button>
 <button class="ghost" onclick="setStatus('${a.id}','Посмотрено')">✅ Посмотрено</button>
 <button class="ghost" onclick="setStatus('${a.id}','Любимое')">❤️ Любимое</button></div>
 <div class="actions"><button class="ghost" onclick="rate('${a.id}',9)">★ 9</button><button class="ghost" onclick="rate('${a.id}',10)">★ 10</button><button class="ghost" onclick="rate('${a.id}',7)">★ 7</button></div>
 ${e.status?`<div class="status">Сейчас: ${e.status}${e.score?` · ★ ${e.score}/10`:""}</div>`:""}</div>`;
}
function closeModal(){document.getElementById("modal").style.display="none"}
function setStatus(id,status){library[id]={...(library[id]||{}),status};save();openAnime(id)}
function rate(id,score){library[id]={...(library[id]||{}),score};save();openAnime(id)}
function surprise(){const a=ANIME.filter(x=>!library[x.id])[Math.floor(Math.random()*ANIME.filter(x=>!library[x.id]).length)];openAnime(a.id)}
render();
</script></body></html>
