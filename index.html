ags":["магия","фейри","исцеление","мифология"],"source":"AnimeShelf seed catalog","cover_url":null,"description_ru":null},{"id":"ANM-0096","title_ru":"Волчица и пряности","title_original":"Spice and Wolf","year":2008,"type":"TV","episodes":25,"status":"FINISHED","genres":["фэнтези","романтика","приключения"],"tags":["торговля","путешествие","экономика","богиня"],"source":"AnimeShelf seed catalog","cover_url":null,"description_ru":null},{"id":"ANM-0097","title_ru":"Мононокэ Химэ","title_original":"Princess Mononoke","year":1997,"type":"MOVIE","episodes":1,"status":"FINISHED","genres":["фэнтези","драма","приключения"],"tags":["природа","духи","война","японская мифология"],"source":"AnimeShelf seed catalog","cover_url":null,"description_ru":null},{"id":"ANM-0098","title_ru":"Магическая битва 0","title_original":"Jujutsu Kaisen 0","year":2021,"type":"MOVIE","episodes":1,"status":"FINISHED","genres":["экшен","фэнтези","драма"],"tags":["проклятия","любовь","школа","сражения"],"source":"AnimeShelf seed catalog","cover_url":null,"description_ru":null},{"id":"ANM-0099","title_ru":"Дитя чудовища","title_original":"The Boy and the Beast","year":2015,"type":"MOVIE","episodes":1,"status":"FINISHED","genres":["фэнтези","приключения","драма"],"tags":["наставник","семья","боевые искусства","взросление"],"source":"AnimeShelf seed catalog","cover_url":null,"description_ru":null},{"id":"ANM-0100","title_ru":"Паприка","title_original":"Paprika","year":2006,"type":"MOVIE","episodes":1,"status":"FINISHED","genres":["фантастика","триллер","психология"],"tags":["сны","технологии","сознание","сюрреализм"],"source":"AnimeShelf seed catalog","cover_url":null,"description_ru":null}];
const KEY="animeshelf_library_v2";
let library=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("animeshelf_library")||"{}");
let currentTab="home"; let libraryFilter="all";
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(library));localStorage.setItem("animeshelf_library",JSON.stringify(library));}
function entry(id){return library[id]||{};}
function find(q){q=q.trim().toLowerCase();if(!q)return ANIME;return ANIME.filter(a=>(a.title_ru+" "+a.title_original+" "+a.genres.join(" ")+" "+a.tags.join(" ")).toLowerCase().includes(q));}
function allFeatures(a){return [...a.genres,...a.tags];}
function card(a){const e=entry(a.id);return `<div class="card" onclick="openAnime('${a.id}')"><div class="poster">${esc(a.title_ru)}</div><div class="info"><div class="title">${esc(a.title_ru)}</div><div class="meta">${a.year} · ${esc(a.type)} · ${a.episodes} эп.</div><div class="chips">${a.genres.slice(0,3).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>${e.score?`<div class="score">★ ${e.score}/10</div>`:""}${e.status?`<div class="status">${esc(e.status)}${e.progress&&a.episodes>1?` · ${e.progress}/${a.episodes}`:""}</div>`:""}</div></div>`}
function nav(id,icon,label){return `<button class="${currentTab===id?'active':''}" onclick="tab('${id}')"><b>${icon}</b>${label}</button>`}
function tab(id){currentTab=id;render();if(id==="search")setTimeout(()=>document.getElementById("q")?.focus(),30)}
function render(){let body="";
 if(currentTab==="home"){
  const rec=recommendations().slice(0,3); body=`<h1>Привет, Тоша 👋</h1><p class="sub">Давай найдём что-нибудь хорошее на сегодня.</p>
  <div class="hero"><div class="eyebrow">Твоя полка</div><h2>🎲 Удиви меня</h2><p>Выберу случайный тайтл из того, что ты ещё не добавлял. А если уже есть оценки — учту твой вкус.</p><button class="btn" onclick="surprise()">Попробовать</button></div>
  <div class="section"><h3>${hasRatings()?"Похоже на твой вкус":"Может тебе зайти"}</h3><span>${rec.length} сейчас</span></div><div class="cards">${rec.map(r=>card(r.anime)).join("")||`<div class="empty">Ты уже разобрал весь наш маленький каталог 😳</div>`}</div>`;
 } else if(currentTab==="search"){
  body=`<h1>Поиск</h1><p class="sub">Ищи по названию, жанру или теме.</p><div class="search"><input id="q" placeholder="Например, «восточный»" oninput="doSearch(this.value)"></div><div id="results">${find("").slice(0,20).map(card).join("")}</div>`;
 } else if(currentTab==="library"){
  const items=ANIME.filter(a=>library[a.id] && (libraryFilter==="all" || (libraryFilter==="favorite"&&library[a.id].status==="Любимое") || (libraryFilter==="watching"&&library[a.id].status==="Смотрю") || (libraryFilter==="done"&&library[a.id].status==="Посмотрено") || (libraryFilter==="want"&&library[a.id].status==="Хочу посмотреть")));
  body=`<h1>Моя библиотека</h1><p class="sub">${ANIME.filter(a=>library[a.id]).length} тайтлов в твоей полке</p><div class="filters">${filterBtn("all","Все")}${filterBtn("watching","Смотрю")}${filterBtn("done","Посмотрено")}${filterBtn("want","Хочу")}${filterBtn("favorite","Любимое")}</div><div class="cards">${items.length?items.map(card).join(""):`<div class="empty">В этой категории пока пусто. 👀</div>`}</div>`;
 } else {
  body=tastePage();
 }
 document.getElementById("root").innerHTML=`<main class="app"><div class="top"><div class="logo">Anime<span>Shelf</span></div><div class="avatar">Т</div></div>${body}</main><nav class="nav">${nav("home","⌂","Главная")}${nav("search","⌕","Поиск")}${nav("library","▣","Библиотека")}${nav("taste","✦","Мой вкус")}</nav><div id="modal" class="modal"></div>`;
}
function filterBtn(id,label){return `<button class="ghost ${libraryFilter===id?'active':''}" onclick="libraryFilter='${id}';render()">${label}</button>`}
function doSearch(q){const r=find(q);document.getElementById("results").innerHTML=r.slice(0,40).map(card).join("")||`<div class="empty">Ничего не нашёл 🤔<br>Попробуй название, жанр или тему.</div>`}
function hasRatings(){return Object.values(library).some(e=>e.score);}
function tasteProfile(){const scores={};const rated=Object.entries(library).filter(([id,e])=>e.score && ANIME.some(a=>a.id===id));for(const [id,e] of rated){const a=ANIME.find(x=>x.id===id);let w=e.score>=8?(e.score-6):e.score<=5?(e.score-7):0.5;for(const f of allFeatures(a))scores[f]=(scores[f]||0)+w;}return {scores,rated};}
function topFeatures(limit=6){const {scores}=tasteProfile();return Object.entries(scores).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,limit)}
function recommendations(){const rated=Object.entries(library).filter(([id,e])=>e.score && ANIME.some(a=>a.id===id));const pool=ANIME.filter(a=>!library[a.id]);if(!rated.length)return pool.map((anime,i)=>({anime,score:100-i,why:["Популярное направление для старта"]}));const prof=tasteProfile().scores;return pool.map(anime=>{let score=0;const reasons=[];for(const f of allFeatures(anime)){if(prof[f]>0){score+=prof[f]*(anime.tags.includes(f)?1.35:1);reasons.push({f,v:prof[f]})}else if(prof[f]<0){score+=prof[f]*0.55}}const unique=[...new Map(reasons.map(x=>[x.f,x])).values()].sort((a,b)=>b.v-a.v).slice(0,3);return {anime,score,why:unique.map(x=>x.f)} }).sort((a,b)=>b.score-a.score)}
function recommendationWhy(a){const rec=recommendations().find(x=>x.anime.id===a.id);if(!rec)return "Добавлен в каталог для знакомства.";if(!hasRatings())return "Пока я не знаю твой вкус. Оцени несколько тайтлов — и объяснение станет персональным.";return rec.why.length?`У тебя уже хорошо заходят: ${rec.why.join(", ")}. Этот тайтл пересекается с ними по темам и/или жанрам.`:"Я пока не вижу точного совпадения, но хочу проверить это предположение на твоей оценке."}
function tastePage(){const rated=Object.entries(library).filter(([id,e])=>e.score).sort((a,b)=>b[1].score-a[1].score);const top=topFeatures(6);const rec=recommendations().slice(0,3);if(!rated.length)return `<h1>Мой вкус</h1><p class="sub">AnimeShelf будет учиться на твоих оценках, а не на чужих рейтингах.</p><div class="hero"><div class="eyebrow">Начинаем с нуля</div><h2>🧠 Давай познакомимся</h2><p>Поставь оценки хотя бы 3–5 тайтлам. Я выделю любимые жанры и темы, а потом смогу объяснять рекомендации.</p><button class="btn" onclick="tab('search')">Пойти оценивать</button></div><div class="section"><h3>Как это работает</h3></div><div class="statgrid"><div class="stat"><b>1–10</b><span>твоя оценка важнее чужой</span></div><div class="stat"><b>🧩</b><span>сравниваем жанры и темы</span></div><div class="stat"><b>💬</b><span>объясняем рекомендацию</span></div><div class="stat"><b>🔄</b><span>вкус меняется вместе с тобой</span></div></div>`;
 const max=top[0]?.[1]||1;return `<h1>Мой вкус</h1><p class="sub">Профиль строится из твоих оценок и постепенно становится точнее.</p><div class="statgrid"><div class="stat"><b>${rated.length}</b><span>оценённых тайтлов</span></div><div class="stat"><b>${rated.filter(([,e])=>e.score>=8).length}</b><span>явных любимчиков</span></div></div><div class="section"><h3>Что тебе заходит</h3><span>по оценкам</span></div>${top.map(([f,v])=>`<div class="taste-row"><div class="taste-label"><span>${esc(f)}</span><span>${Math.round(v/max*100)}%</span></div><div class="bar"><i style="width:${Math.max(8,Math.min(100,v/max*100))}%"></i></div></div>`).join("")}<div class="section"><h3>Персональные рекомендации</h3></div><div class="cards">${rec.map(r=>`<div onclick="openAnime('${r.anime.id}')">${card(r.anime)}<div class="recommend-label">Почему тебе может зайти</div><div class="small-note">${esc(recommendationWhy(r.anime))}</div></div>`).join("")}</div><div class="section"><h3>Твои самые высокие оценки</h3></div><div class="cards">${rated.slice(0,5).map(([id])=>card(ANIME.find(a=>a.id===id))).join("")}</div>`}
function openAnime(id){const a=ANIME.find(x=>x.id===id),e=entry(id),rec=recommendationWhy(a);const current=e.score||0;const progress=Math.min(a.episodes,e.progress||0);document.getElementById("modal").style.display="flex";document.getElementById("modal").innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="poster big">${esc(a.title_ru)}</div><h2>${esc(a.title_ru)}</h2><div class="meta">${esc(a.title_original)} · ${a.year} · ${esc(a.type)} · ${a.episodes} эп.</div><div class="chips">${a.genres.concat(a.tags).slice(0,10).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><div class="why"><strong>💡 Почему тебе может зайти</strong><p>${esc(rec)}</p></div><div class="actions"><button class="ghost ${e.status==='Хочу посмотреть'?'active':''}" onclick="setStatus('${id}','Хочу посмотреть')">📌 Хочу</button><button class="ghost ${e.status==='Смотрю'?'active':''}" onclick="setStatus('${id}','Смотрю')">👀 Смотрю</button><button class="ghost ${e.status==='Посмотрено'?'active':''}" onclick="setStatus('${id}','Посмотрено')">✅ Посмотрено</button><button class="ghost ${e.status==='Любимое'?'active':''}" onclick="setStatus('${id}','Любимое')">❤️ Любимое</button></div><div class="section"><h3>Твоя оценка</h3><span>${current?`★ ${current}/10`:'ещё нет'}</span></div><div class="rating">${Array.from({length:10},(_,i)=>{const n=i+1;return `<button class="rate ${current===n?'active':''}" onclick="rate('${id}',${n})">${n}</button>`}).join("")}</div>${a.episodes>1?`<div class="progress"><div class="progress-row"><span>Прогресс</span><span id="progressValue">${progress}/${a.episodes}</span></div><input type="range" min="0" max="${a.episodes}" value="${progress}" oninput="setProgress('${id}',this.value)"></div>`:''}<div class="small-note" style="margin-top:16px">Оценка влияет на твой профиль вкуса и следующие рекомендации. Можно изменить её в любой момент.</div></div>`}
function closeModal(){document.getElementById("modal").style.display="none"}
function setStatus(id,status){library[id]={...(library[id]||{}),status};if(status==='Посмотрено'){const a=ANIME.find(x=>x.id===id);if(a)library[id].progress=a.episodes}save();openAnime(id);render();}
function rate(id,score){library[id]={...(library[id]||{}),score};save();openAnime(id);render();}
function setProgress(id,value){const v=Number(value);library[id]={...(library[id]||{}),progress:v};save();const el=document.getElementById("progressValue");if(el)el.textContent=v+"/"+ANIME.find(a=>a.id===id).episodes;}
function surprise(){const pool=ANIME.filter(x=>!library[x.id]);if(!pool.length)return;const ranked=recommendations();const a=(hasRatings()&&ranked[0]?ranked[0].anime:pool[Math.floor(Math.random()*pool.length)]);openAnime(a.id)}
render();
</script></body></html>
